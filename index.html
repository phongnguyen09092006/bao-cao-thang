<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Báo Cáo Bán Hàng - HÙNG DŨNG</title>
    <style>
        :root {
            --primary: #007aff;
            --success: #34c759;
            --danger: #ff3b30;
            --bg: #f2f2f7;
            --card-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-sub: #6c6c70;
            --border: #d1d1d6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 14px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        .header {
            text-align: center;
            margin-bottom: 14px;
        }
        .header h1 {
            font-size: 19px;
            margin: 0;
            color: var(--text-main);
        }
        .header p {
            font-size: 13px;
            color: var(--text-sub);
            margin: 3px 0 0;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 14.5px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .input-group {
            margin-bottom: 6px;
        }
        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-sub);
            margin-bottom: 3px;
        }
        input, textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 10px;
            font-size: 14px;
            box-sizing: border-box;
            background: #fff;
            color: var(--text-main);
        }
        input[type="date"] {
            cursor: pointer;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .date-preview {
            font-size: 12.5px;
            font-weight: 600;
            margin-top: 4px;
            color: var(--primary);
        }
        .input-deduction {
            border-color: #ff9500;
            background-color: #fff9f0;
            color: #d93800;
            font-weight: 600;
        }
        textarea {
            height: 140px;
            resize: vertical;
            font-family: monospace;
            line-height: 1.4;
        }
        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary {
            background-color: var(--primary);
            color: white;
            margin-top: 6px;
        }
        .btn-copy {
            background-color: var(--success);
            color: white;
            margin-top: 8px;
        }
        .btn-toggle {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 12.5px;
            padding: 2px 4px;
            width: auto;
            font-weight: normal;
        }
        .result-box {
            background: #f9f9fb;
            border: 1px dashed var(--success);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 13.5px;
            white-space: pre-wrap;
            line-height: 1.5;
            color: #111;
        }
        .history-item {
            border-bottom: 1px solid #e5e5ea;
            padding: 8px 0;
            font-size: 12.5px;
            display: flex;
            justify-content: space-between;
        }
        .history-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 Báo Cáo Bán Hàng</h1>
        <p>NV: HÙNG DŨNG</p>
    </div>

    <!-- 1. CÀI ĐẶT CHỈ TIÊU (KPI) - TỰ ĐỘNG LƯU MỌI THAY ĐỔI -->
    <div class="card">
        <div class="card-title">
            <span>🎯 Chỉ tiêu tháng (KPI)</span>
        </div>
        <div>
            <div class="grid-2">
                <div class="input-group">
                    <label>DS bán giấy (tháng - k):</label>
                    <input type="number" id="kpiMonthRevenue" value="120000" oninput="saveKpiSettings()">
                </div>
                <div class="input-group">
                    <label>Chỉ tiêu DS ngày (k):</label>
                    <input type="number" id="kpiDayRevenue" value="4600" oninput="saveKpiSettings()">
                </div>
            </div>
            <div class="grid-2">
                <div class="input-group">
                    <label>Tổng đơn hoàn thành:</label>
                    <input type="number" id="kpiTotalOrders" value="175" oninput="saveKpiSettings()">
                </div>
                <div class="input-group">
                    <label>Ngày công chuẩn:</label>
                    <input type="number" id="kpiStandardDays" value="25" oninput="saveKpiSettings()">
                </div>
            </div>
        </div>
    </div>

    <!-- 2. DỮ LIỆU ĐƠN HÀNG HÔM NAY -->
    <div class="card">
        <div class="card-title">📝 Thông tin báo cáo</div>
        
        <!-- MỤC CHỌN LỊCH NGÀY BÁO CÁO -->
        <div class="input-group">
            <label>📅 Chọn ngày báo cáo (Bấm vào lịch để chọn):</label>
            <input type="date" id="reportDate" onchange="handleDateChange()">
            <div id="datePreview" class="date-preview">⚠️ Chưa chọn ngày báo cáo</div>
        </div>

        <div class="grid-3" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px;">
            <div class="input-group">
                <label>Ngày công:</label>
                <input type="number" id="workDay" placeholder="Để trống">
            </div>
            <div class="input-group">
                <label>DS cũ (k):</label>
                <input type="number" id="prevRevenue" placeholder="Để trống">
            </div>
            <div class="input-group">
                <label>Đơn cũ:</label>
                <input type="number" id="prevOrders" placeholder="Để trống">
            </div>
        </div>

        <!-- MỤC TRỪ TIỀN RỚT ĐƠN (MỖI LẦN TÍNH XONG TỰ RESET VỀ 0) -->
        <div class="input-group" style="margin-top: 4px;">
            <label style="color: #d93800; font-weight: 600;">⚠️ Tiền rớt đơn kế toán báo trừ (k):</label>
            <input type="number" id="deductionAmount" class="input-deduction" value="0" placeholder="Nhập số tiền trừ nếu có, không có để 0">
        </div>

        <div class="input-group" style="margin-top: 6px;">
            <label>Dán nội dung đơn hàng vào đây:</label>
            <textarea id="rawText" placeholder="Dán danh sách đơn (Ngày 28/9... ĐH 1... Đh 2...) vào đây..." oninput="autoDetectDate()"></textarea>
        </div>

        <button class="btn-primary" onclick="processOrders()">⚡ Tính toán & Xuất báo cáo</button>
    </div>

    <!-- 3. KẾT QUẢ XUẤT RA -->
    <div class="card" id="resultCard" style="display: none;">
        <div class="card-title">📋 Văn bản nộp báo cáo</div>
        <div class="result-box" id="reportOutput"></div>
        <button class="btn-copy" onclick="copyReport()">📋 Sao chép báo cáo gửi Zalo</button>
    </div>

    <!-- 4. LỊCH SỬ - MẶC ĐỊNH MỞ VÀ CÓ NÚT XEM/ẨN -->
    <div class="card">
        <div class="card-title">
            <span>📜 Lịch sử các ngày</span>
            <button class="btn-toggle" onclick="toggleElement('historyBox')">Xem/Ẩn</button>
        </div>
        <div id="historyBox">
            <div id="historyList"></div>
            <button style="background: var(--danger); color: white; padding: 6px; font-size: 12px; margin-top: 10px;" onclick="clearHistory()">Xóa toàn bộ lịch sử</button>
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        loadKpiSettings();
        loadDataFromHistory();
        renderHistory();
        document.getElementById('deductionAmount').value = 0;
    };

    // Tự động lưu cài đặt KPI vào bộ nhớ máy mỗi khi nhập
    function saveKpiSettings() {
        localStorage.setItem('hd_kpi_month', document.getElementById('kpiMonthRevenue').value);
        localStorage.setItem('hd_kpi_day', document.getElementById('kpiDayRevenue').value);
        localStorage.setItem('hd_kpi_orders', document.getElementById('kpiTotalOrders').value);
        localStorage.setItem('hd_kpi_days', document.getElementById('kpiStandardDays').value);
    }

    // Tự động tải cài đặt KPI từ bộ nhớ máy khi mở app
    function loadKpiSettings() {
        if (localStorage.getItem('hd_kpi_month') !== null) {
            document.getElementById('kpiMonthRevenue').value = localStorage.getItem('hd_kpi_month');
        }
        if (localStorage.getItem('hd_kpi_day') !== null) {
            document.getElementById('kpiDayRevenue').value = localStorage.getItem('hd_kpi_day');
        }
        if (localStorage.getItem('hd_kpi_orders') !== null) {
            document.getElementById('kpiTotalOrders').value = localStorage.getItem('hd_kpi_orders');
        }
        if (localStorage.getItem('hd_kpi_days') !== null) {
            document.getElementById('kpiStandardDays').value = localStorage.getItem('hd_kpi_days');
        }
    }

    // Kiểm tra và áp dụng quy tắc mùng 1
    function applyMung1RuleIfDay1(d) {
        if (d === 1) {
            document.getElementById('workDay').value = 1;
            document.getElementById('prevRevenue').value = 0;
            document.getElementById('prevOrders').value = 0;
        }
    }

    // Xử lý khi người dùng đổi ngày trên lịch
    function handleDateChange() {
        updateDateDisplay();
        const val = document.getElementById('reportDate').value;
        if (val) {
            const [y, m, d] = val.split('-').map(Number);
            applyMung1RuleIfDay1(d);
        }
    }

    // Cập nhật dòng chữ hiển thị tiếng Việt phía dưới ô lịch
    function updateDateDisplay() {
        const val = document.getElementById('reportDate').value;
        const preview = document.getElementById('datePreview');
        if (!val) {
            preview.innerHTML = '<span style="color:#ff3b30;">⚠️ Chưa chọn ngày báo cáo (Bấm vào ô lịch bên trên để chọn)</span>';
            return;
        }
        const [y, m, d] = val.split('-').map(Number);
        preview.innerHTML = `✅ Đã chọn: Ngày <b>${d}</b> tháng <b>${m}</b> năm <b>${y}</b> (${d}/${m}/${y})`;
    }

    // Đặt ngày vào ô lịch chuẩn ISO YYYY-MM-DD
    function setCalendarDate(d, m, y) {
        const yyyy = y;
        const mm = String(m).padStart(2, '0');
        const dd = String(d).padStart(2, '0');
        document.getElementById('reportDate').value = `${yyyy}-${mm}-${dd}`;
        updateDateDisplay();
        applyMung1RuleIfDay1(d);
    }

    // Tự động nhận diện định dạng ngày trong văn bản
    function autoDetectDate() {
        const text = document.getElementById('rawText').value;
        if (!text) return;

        let match = text.match(/(?:ngày[:\s]+)(\d{1,2})[\/\.\-](\d{1,2})(?:[\/\.\-](\d{2,4}))?/i);
        if (!match) {
            match = text.match(/(?:^|\n)\s*(\d{1,2})[\/\.\-](\d{1,2})(?:[\/\.\-](\d{2,4}))?/);
        }

        if (match) {
            const d = parseInt(match[1], 10);
            const m = parseInt(match[2], 10);
            let y = match[3] ? parseInt(match[3], 10) : new Date().getFullYear();
            if (y < 100) y += 2000;
            if (d >= 1 && d <= 31 && m >= 1 && m <= 12) {
                setCalendarDate(d, m, y);
            }
        }
    }

    // Tính ngày tiếp theo từ ngày ISO (YYYY-MM-DD)
    function getNextDayFromISO(isoStr) {
        if (!isoStr) return null;
        const [y, m, d] = isoStr.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        dt.setDate(dt.getDate() + 1);
        return { day: dt.getDate(), month: dt.getMonth() + 1, year: dt.getFullYear() };
    }

    // Nạp dữ liệu từ lịch sử
    function loadDataFromHistory() {
        const history = JSON.parse(localStorage.getItem('hd_history') || '[]');
        if (history.length > 0) {
            const last = history[0];
            if (last.isoDate) {
                const nextDay = getNextDayFromISO(last.isoDate);
                if (nextDay) {
                    setCalendarDate(nextDay.day, nextDay.month, nextDay.year);
                    if (nextDay.day === 1) {
                        applyMung1RuleIfDay1(1);
                    } else {
                        document.getElementById('prevRevenue').value = last.cumulative;
                        document.getElementById('prevOrders').value = last.cumulativeOrders;
                        document.getElementById('workDay').value = (parseInt(last.workDay) || 0) + 1;
                    }
                }
            }
        } else {
            // Ngày đầu tiên: để trống hoàn toàn chờ nhập
            document.getElementById('reportDate').value = '';
            document.getElementById('prevRevenue').value = '';
            document.getElementById('prevOrders').value = '';
            document.getElementById('workDay').value = '';
            updateDateDisplay();
        }
    }

    function processOrders() {
        const text = document.getElementById('rawText').value;
        if (!text.trim()) {
            alert("Vui lòng dán nội dung đơn hàng!");
            return;
        }

        // 1. Kiểm tra ngày báo cáo
        const dateVal = document.getElementById('reportDate').value;
        if (!dateVal) {
            alert("Vui lòng chọn ngày báo cáo từ ô lịch trước khi tính!");
            return;
        }
        const [y, m, d] = dateVal.split('-').map(Number);
        const displayDateStr = `${d}/${m}/${y}`;

        // 2. Đếm số lượng đơn hàng
        const orderMatches = text.match(/(?:ĐH|Đh|DH|dh)\s*\d+[:\s]/gi);
        const todayOrders = orderMatches ? orderMatches.length : 0;

        // 3. Tính tiền bán được hôm nay
        const lineRegex = /(\d+)\s*(?:bành|lốc|thùng|cuộn|gói|hộp)?\s*[x*]\s*([\d\.,]+)/gi;
        let todayRevenue = 0;
        let match;

        while ((match = lineRegex.exec(text)) !== null) {
            let qty = parseFloat(match[1]) || 0;
            let price = parseFloat(match[2].replace(',', '.')) || 0;
            todayRevenue += (qty * price);
        }
        todayRevenue = Math.round(todayRevenue);

        // 4. Lấy số cũ, số tiền rớt đơn và KPI
        const prevRev = parseFloat(document.getElementById('prevRevenue').value) || 0;
        const prevOrd = parseInt(document.getElementById('prevOrders').value) || 0;
        const workDay = parseInt(document.getElementById('workDay').value) || 1;
        const deduction = parseFloat(document.getElementById('deductionAmount').value) || 0;

        const kpiMonth = parseFloat(document.getElementById('kpiMonthRevenue').value) || 120000;
        const kpiDay = parseFloat(document.getElementById('kpiDayRevenue').value) || 4600;
        const kpiOrders = parseInt(document.getElementById('kpiTotalOrders').value) || 175;
        const kpiDays = parseInt(document.getElementById('kpiStandardDays').value) || 25;

        // Tổng doanh số lũy kế = Cũ + Hôm nay - Rớt đơn
        const totalRev = prevRev + todayRevenue - deduction;
        const totalOrd = prevOrd + todayOrders;

        // 5. Làm tròn thông thường (Math.round)
        const timeRate = Math.min(100, Math.round((workDay / kpiDays) * 100));
        const dayRate = Math.round((todayRevenue / kpiDay) * 100);
        const monthRate = Math.round((totalRev / kpiMonth) * 100);
        const orderRate = Math.round((totalOrd / kpiOrders) * 100);

        const kpiMonthLabel = (kpiMonth >= 1000) ? (kpiMonth / 1000) + 'tr' : kpiMonth + 'k';

        // 6. Xuất mẫu báo cáo hoàn chỉnh
        const report = 
`Báo cáo bán hàng ngày:      ${displayDateStr}
- NV: HÙNG DŨNG
- Tiến độ thời gian : ${workDay}/${kpiDays}/${timeRate}%
- DS  bán giấy : ${todayRevenue}/${totalRev}/${kpiMonthLabel}
- DS ngày : ${todayRevenue}/${kpiDay}/${dayRate}%
- Tiến độ % đạt: ${monthRate}%
- Đơn hàng: ${todayOrders}/${totalOrd}/${kpiOrders}/${orderRate}%
- Trưng bày 3%: o
- Trưng bày 5%: 0`;

        document.getElementById('reportOutput').innerText = report;
        document.getElementById('resultCard').style.display = 'block';

        // 7. Lưu lại lịch sử
        saveToHistory(dateVal, displayDateStr, workDay, todayOrders, todayRevenue, totalRev, totalOrd, deduction);

        // Reset ô rớt đơn về 0 cho lần sau
        document.getElementById('deductionAmount').value = 0;
    }

    function copyReport() {
        const text = document.getElementById('reportOutput').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("Đã sao chép báo cáo! Bạn có thể dán gửi Zalo ngay.");
        });
    }

    function saveToHistory(isoDate, dateStr, workDay, orders, revenue, cumulative, cumulativeOrders, deduction) {
        let history = JSON.parse(localStorage.getItem('hd_history') || '[]');
        
        history.unshift({
            isoDate: isoDate,
            date: dateStr,
            workDay: workDay,
            orders: orders,
            revenue: revenue,
            cumulative: cumulative,
            cumulativeOrders: cumulativeOrders,
            deduction: deduction
        });

        localStorage.setItem('hd_history', JSON.stringify(history));
        renderHistory();

        // Tự động nhảy sang ngày tiếp theo trên lịch cho lần tính tới
        const nextDay = getNextDayFromISO(isoDate);
        if (nextDay) {
            setCalendarDate(nextDay.day, nextDay.month, nextDay.year);
            if (nextDay.day === 1) {
                applyMung1RuleIfDay1(1);
            } else {
                document.getElementById('prevRevenue').value = cumulative;
                document.getElementById('prevOrders').value = cumulativeOrders;
                document.getElementById('workDay').value = parseInt(workDay) + 1;
            }
        }
        document.getElementById('rawText').value = '';
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('hd_history') || '[]');
        const container = document.getElementById('historyList');
        if (history.length === 0) {
            container.innerHTML = '<p style="color:#8e8e93; font-size:12px; margin:0;">Chưa có dữ liệu nào trong lịch sử.</p>';
            return;
        }
        container.innerHTML = history.map(item => `
            <div class="history-item">
                <span><b>📅 ${item.date}</b> (${item.orders} đơn${item.deduction > 0 ? ` - trừ rớt ${item.deduction}k` : ''})</span>
                <span>Ngày: <b>${item.revenue.toLocaleString('vi-VN')}k</b> | DS lũy kế: <b>${item.cumulative.toLocaleString('vi-VN')}k</b></span>
            </div>
        `).join('');
    }

    function toggleElement(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'none') ? 'block' : 'none';
    }

    function clearHistory() {
        if (confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử các ngày đã tính? (Các cài đặt KPI vẫn được giữ nguyên)")) {
            localStorage.removeItem('hd_history');
            location.reload();
        }
    }
</script>

</body>
</html>
