<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Báo Cáo Bán Hàng - HÙNG DŨNG</title>
    <style>
        :root {
            --primary: #007aff;
            --success: #34c759;
            --danger: #ff3b30;
            --excel: #107c41;
            --bg: #f2f2f7;
            --card-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-sub: #6c6c70;
            --border: #d1d1d6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 14px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        .header {
            text-align: center;
            margin-bottom: 14px;
        }
        .header h1 {
            font-size: 19px;
            margin: 0;
            color: var(--text-main);
        }
        .header p {
            font-size: 13px;
            color: var(--text-sub);
            margin: 3px 0 0;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 14.5px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .input-group {
            margin-bottom: 6px;
        }
        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-sub);
            margin-bottom: 3px;
        }
        input, textarea, select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 10px;
            font-size: 14px;
            box-sizing: border-box;
            background: #fff;
            color: var(--text-main);
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }
        .date-badge {
            background: #e1f0ff;
            color: #007aff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 4px;
            display: inline-block;
        }
        .input-deduction {
            border-color: #ff9500;
            background-color: #fff9f0;
            color: #d93800;
            font-weight: 600;
        }
        textarea {
            height: 140px;
            resize: vertical;
            font-family: monospace;
            line-height: 1.4;
        }
        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary {
            background-color: var(--primary);
            color: white;
            margin-top: 6px;
        }
        .btn-copy {
            background-color: var(--success);
            color: white;
            margin-top: 8px;
        }
        .btn-excel {
            background-color: var(--excel);
            color: white;
            margin-top: 8px;
        }
        .btn-toggle {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 12.5px;
            padding: 2px 4px;
            width: auto;
            font-weight: normal;
        }
        .status-sync {
            font-size: 12px;
            text-align: center;
            margin-top: 6px;
            font-weight: 500;
        }
        .result-box {
            background: #f9f9fb;
            border: 1px dashed var(--success);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 13.5px;
            white-space: pre-wrap;
            line-height: 1.5;
            color: #111;
        }
        .history-item {
            border-bottom: 1px solid #e5e5ea;
            padding: 8px 0;
            font-size: 12.5px;
            display: flex;
            justify-content: space-between;
        }
        .history-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 Báo Cáo Bán Hàng</h1>
        <p>NV: HÙNG DŨNG</p>
    </div>

    <!-- 1. CÀI ĐẶT CHỈ TIÊU (KPI) - TỰ ĐỘNG LƯU -->
    <div class="card">
        <div class="card-title">
            <span>🎯 Chỉ tiêu tháng (KPI)</span>
        </div>
        <div>
            <div class="grid-2">
                <div class="input-group">
                    <label>DS bán giấy (tháng - k):</label>
                    <input type="number" id="kpiMonthRevenue" value="120000" oninput="saveKpiSettings()">
                </div>
                <div class="input-group">
                    <label>Chỉ tiêu DS ngày (k):</label>
                    <input type="number" id="kpiDayRevenue" value="4600" oninput="saveKpiSettings()">
                </div>
            </div>
            <div class="grid-2">
                <div class="input-group">
                    <label>Tổng đơn hoàn thành:</label>
                    <input type="number" id="kpiTotalOrders" value="175" oninput="saveKpiSettings()">
                </div>
                <div class="input-group">
                    <label>Ngày công chuẩn:</label>
                    <input type="number" id="kpiStandardDays" value="25" oninput="saveKpiSettings()">
                </div>
            </div>
        </div>
    </div>

    <!-- 2. DỮ LIỆU ĐƠN HÀNG HÔM NAY -->
    <div class="card">
        <div class="card-title">📝 Thông tin báo cáo</div>
        
        <!-- CHỌN RÕ RÀNG NGÀY - THÁNG - NĂM (KHÔNG BỊ NHẦM THỨ TỰ) -->
        <label style="font-size: 12px; font-weight: 600; color: var(--text-main);">📅 Ngày báo cáo:</label>
        <div class="grid-3" style="margin-top: 4px;">
            <div class="input-group">
                <label>Ngày:</label>
                <select id="selDay" onchange="onDateSelectionChanged()">
                    <option value="">--</option>
                    <!-- Tự động sinh từ ngày 1 đến 31 -->
                </select>
            </div>
            <div class="input-group">
                <label>Tháng:</label>
                <select id="selMonth" onchange="onDateSelectionChanged()">
                    <option value="">--</option>
                    <!-- Tự động sinh từ tháng 1 đến 12 -->
                </select>
            </div>
            <div class="input-group">
                <label>Năm:</label>
                <input type="number" id="selYear" value="2026" oninput="onDateSelectionChanged()">
            </div>
        </div>
        <div id="dateNotice" class="date-badge">Chưa chọn ngày</div>

        <div class="grid-3" style="margin-top: 10px;">
            <div class="input-group">
                <label>Ngày công:</label>
                <input type="number" id="workDay" placeholder="Để trống">
            </div>
            <div class="input-group">
                <label>DS cũ (k):</label>
                <input type="number" id="prevRevenue" placeholder="Để trống">
            </div>
            <div class="input-group">
                <label>Đơn cũ:</label>
                <input type="number" id="prevOrders" placeholder="Để trống">
            </div>
        </div>

        <div class="input-group" style="margin-top: 4px;">
            <label style="color: #d93800; font-weight: 600;">⚠️ Tiền rớt đơn kế toán báo trừ (k):</label>
            <input type="number" id="deductionAmount" class="input-deduction" value="0" placeholder="Nhập số tiền trừ nếu có, không có để 0">
        </div>

        <div class="input-group" style="margin-top: 6px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <label style="margin: 0;">Dán nội dung đơn hàng vào đây:</label>
                <button type="button" class="btn-toggle" onclick="autoDetectDateFromText()">🔍 Lấy ngày từ text</button>
            </div>
            <textarea id="rawText" placeholder="Dán danh sách đơn (ĐH 1, Đh 2...) vào đây..."></textarea>
        </div>

        <button class="btn-primary" id="btnSubmit" onclick="processOrders()">⚡ Tính toán & Đồng bộ lên Drive</button>
        <div id="syncStatus" class="status-sync"></div>
    </div>

    <!-- 3. KẾT QUẢ XUẤT RA -->
    <div class="card" id="resultCard" style="display: none;">
        <div class="card-title">📋 Văn bản nộp báo cáo</div>
        <div class="result-box" id="reportOutput"></div>
        <button class="btn-copy" onclick="copyReport()">📋 Sao chép báo cáo gửi Zalo</button>
    </div>

    <!-- 4. LỊCH SỬ & XUẤT BẢNG TÍNH -->
    <div class="card">
        <div class="card-title">
            <span>📜 Lịch sử các ngày</span>
            <button class="btn-toggle" onclick="toggleElement('historyBox')">Xem/Ẩn</button>
        </div>
        <div id="historyBox">
            <div id="historyList"></div>
            
            <button class="btn-excel" onclick="exportToCSV()">
                📗 Tải file bảng tính (.CSV) về máy
            </button>
            
            <button style="background: var(--danger); color: white; padding: 6px; font-size: 12px; margin-top: 10px;" onclick="clearHistory()">Xóa toàn bộ lịch sử</button>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SHEET_URL = "";

    window.onload = function() {
        initDropdowns();
        loadKpiSettings();
        loadDataFromHistory();
        renderHistory();
        document.getElementById('deductionAmount').value = 0;
    };

    function initDropdowns() {
        const daySelect = document.getElementById('selDay');
        for (let i = 1; i <= 31; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.textContent = i;
            daySelect.appendChild(opt);
        }

        const monthSelect = document.getElementById('selMonth');
        for (let i = 1; i <= 12; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `Tháng ${i}`;
            monthSelect.appendChild(opt);
        }
    }

    function saveKpiSettings() {
        localStorage.setItem('hd_kpi_month', document.getElementById('kpiMonthRevenue').value);
        localStorage.setItem('hd_kpi_day', document.getElementById('kpiDayRevenue').value);
        localStorage.setItem('hd_kpi_orders', document.getElementById('kpiTotalOrders').value);
        localStorage.setItem('hd_kpi_days', document.getElementById('kpiStandardDays').value);
    }

    function loadKpiSettings() {
        if (localStorage.getItem('hd_kpi_month') !== null) {
            document.getElementById('kpiMonthRevenue').value = localStorage.getItem('hd_kpi_month');
        }
        if (localStorage.getItem('hd_kpi_day') !== null) {
            document.getElementById('kpiDayRevenue').value = localStorage.getItem('hd_kpi_day');
        }
        if (localStorage.getItem('hd_kpi_orders') !== null) {
            document.getElementById('kpiTotalOrders').value = localStorage.getItem('hd_kpi_orders');
        }
        if (localStorage.getItem('hd_kpi_days') !== null) {
            document.getElementById('kpiStandardDays').value = localStorage.getItem('hd_kpi_days');
        }
    }

    function applyMung1RuleIfDay1(d) {
        if (d === 1) {
            document.getElementById('workDay').value = 1;
            document.getElementById('prevRevenue').value = 0;
            document.getElementById('prevOrders').value = 0;
        }
    }

    function onDateSelectionChanged() {
        const d = parseInt(document.getElementById('selDay').value, 10);
        const m = parseInt(document.getElementById('selMonth').value, 10);
        const y = parseInt(document.getElementById('selYear').value, 10) || 2026;

        if (d && m) {
            document.getElementById('dateNotice').innerText = `✅ Báo cáo ngày: ${d}/${m}/${y}`;
            applyMung1RuleIfDay1(d);
        } else {
            document.getElementById('dateNotice').innerText = "⚠️ Chưa chọn đủ ngày và tháng";
        }
    }

    function setDateFields(d, m, y) {
        document.getElementById('selDay').value = d;
        document.getElementById('selMonth').value = m;
        document.getElementById('selYear').value = y;
        onDateSelectionChanged();
    }

    // Nút chủ động bóc tách ngày từ đoạn chat nếu người dùng muốn
    function autoDetectDateFromText() {
        const text = document.getElementById('rawText').value;
        if (!text) {
            alert("Vui lòng dán văn bản đơn hàng trước!");
            return;
        }
        let match = text.match(/(?:ngày[:\s]+)(\d{1,2})[\/\.\-](\d{1,2})(?:[\/\.\-](\d{2,4}))?/i);
        if (!match) {
            match = text.match(/(?:^|\n)\s*(\d{1,2})[\/\.\-](\d{1,2})(?:[\/\.\-](\d{2,4}))?/);
        }
        if (match) {
            const d = parseInt(match[1], 10);
            const m = parseInt(match[2], 10);
            let y = match[3] ? parseInt(match[3], 10) : 2026;
            if (y < 100) y += 2000;
            setDateFields(d, m, y);
            alert(`Đã nhận diện ngày: ${d}/${m}/${y}`);
        } else {
            alert("Không tìm thấy ngày trong văn bản!");
        }
    }

    // THUẬT TOÁN TÍNH TOÁN NGÀY KẾ TIẾP CHUẨN XÁC 100%
    function calculateNextDay(d, m, y) {
        // Tháng có 30 ngày: 4, 6, 9, 11
        // Tháng có 31 ngày: 1, 3, 5, 7, 8, 10, 12
        // Tháng 2 có 28 hoặc 29 ngày
        let maxDays = 31;
        if (m === 4 || m === 6 || m === 9 || m === 11) {
            maxDays = 30;
        } else if (m === 2) {
            maxDays = (y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0)) ? 29 : 28;
        }

        let nextD = d + 1;
        let nextM = m;
        let nextY = y;

        if (nextD > maxDays) {
            nextD = 1;
            nextM += 1;
            if (nextM > 12) {
                nextM = 1;
                nextY += 1;
            }
        }

        return { day: nextD, month: nextM, year: nextY };
    }

    function loadDataFromHistory() {
        const history = JSON.parse(localStorage.getItem('hd_history') || '[]');
        if (history.length > 0) {
            const last = history[0];
            if (last.day && last.month && last.year) {
                const next = calculateNextDay(last.day, last.month, last.year);
                setDateFields(next.day, next.month, next.year);

                if (next.day === 1) {
                    applyMung1RuleIfDay1(1);
                } else {
                    document.getElementById('prevRevenue').value = last.cumulative;
                    document.getElementById('prevOrders').value = last.cumulativeOrders;
                    document.getElementById('workDay').value = (parseInt(last.workDay, 10) || 0) + 1;
                }
            }
        } else {
            // Ngày đầu tiên: để trống hoàn toàn
            document.getElementById('selDay').value = "";
            document.getElementById('selMonth').value = "";
            document.getElementById('prevRevenue').value = '';
            document.getElementById('prevOrders').value = '';
            document.getElementById('workDay').value = '';
            document.getElementById('dateNotice').innerText = "Chưa chọn ngày";
        }
    }

    async function processOrders() {
        const text = document.getElementById('rawText').value;
        if (!text.trim()) {
            alert("Vui lòng dán nội dung đơn hàng!");
            return;
        }

        const d = parseInt(document.getElementById('selDay').value, 10);
        const m = parseInt(document.getElementById('selMonth').value, 10);
        const y = parseInt(document.getElementById('selYear').value, 10) || 2026;

        if (!d || !m) {
            alert("Vui lòng chọn Ngày và Tháng của báo cáo!");
            return;
        }

        const displayDateStr = `${d}/${m}/${y}`;

        // 1. Đếm số đơn hàng
        const orderMatches = text.match(/(?:ĐH|Đh|DH|dh)\s*\d+[:\s]/gi);
        const todayOrders = orderMatches ? orderMatches.length : 0;

        // 2. Tính doanh số trong ngày
        const lineRegex = /(\d+)\s*(?:bành|lốc|thùng|cuộn|gói|hộp)?\s*[x*]\s*([\d\.,]+)/gi;
        let todayRevenue = 0;
        let match;

        while ((match = lineRegex.exec(text)) !== null) {
            let qty = parseFloat(match[1]) || 0;
            let price = parseFloat(match[2].replace(',', '.')) || 0;
            todayRevenue += (qty * price);
        }
        todayRevenue = Math.round(todayRevenue);

        // 3. Lấy số cũ và KPI
        const prevRev = parseFloat(document.getElementById('prevRevenue').value) || 0;
        const prevOrd = parseInt(document.getElementById('prevOrders').value) || 0;
        const workDay = parseInt(document.getElementById('workDay').value) || 1;
        const deduction = parseFloat(document.getElementById('deductionAmount').value) || 0;

        const kpiMonth = parseFloat(document.getElementById('kpiMonthRevenue').value) || 120000;
        const kpiDay = parseFloat(document.getElementById('kpiDayRevenue').value) || 4600;
        const kpiOrders = parseInt(document.getElementById('kpiTotalOrders').value) || 175;
        const kpiDays = parseInt(document.getElementById('kpiStandardDays').value) || 25;

        const totalRev = prevRev + todayRevenue - deduction;
        const totalOrd = prevOrd + todayOrders;

        const timeRate = Math.min(100, Math.round((workDay / kpiDays) * 100));
        const dayRate = Math.round((todayRevenue / kpiDay) * 100);
        const monthRate = Math.round((totalRev / kpiMonth) * 100);
        const orderRate = Math.round((totalOrd / kpiOrders) * 100);

        const kpiMonthLabel = (kpiMonth >= 1000) ? (kpiMonth / 1000) + 'tr' : kpiMonth + 'k';

        // 4. Xuất mẫu báo cáo
        const report = 
`Báo cáo bán hàng ngày:      ${displayDateStr}
- NV: HÙNG DŨNG
- Tiến độ thời gian : ${workDay}/${kpiDays}/${timeRate}%
- DS  bán giấy : ${todayRevenue}/${totalRev}/${kpiMonthLabel}
- DS ngày : ${todayRevenue}/${kpiDay}/${dayRate}%
- Tiến độ % đạt: ${monthRate}%
- Đơn hàng: ${todayOrders}/${totalOrd}/${kpiOrders}/${orderRate}%
- Trưng bày 3%: o
- Trưng bày 5%: 0`;

        document.getElementById('reportOutput').innerText = report;
        document.getElementById('resultCard').style.display = 'block';

        // 5. Lưu lịch sử
        saveToHistory(d, m, y, displayDateStr, workDay, todayOrders, todayRevenue, totalRev, totalOrd, deduction, text);
        document.getElementById('deductionAmount').value = 0;

        // 6. Đồng bộ Google Drive
        const syncStatus = document.getElementById('syncStatus');
        if (GOOGLE_SHEET_URL && GOOGLE_SHEET_URL.startsWith("https://script.google.com")) {
            syncStatus.innerHTML = '<span style="color:#007aff;">⏳ Đang đồng bộ lên Google Drive...</span>';
            try {
                await fetch(GOOGLE_SHEET_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        date: displayDateStr,
                        workDay: workDay,
                        orders: todayOrders,
                        revenue: todayRevenue,
                        deduction: deduction,
                        cumulative: totalRev,
                        cumulativeOrders: totalOrd,
                        rawText: text
                    })
                });
                syncStatus.innerHTML = '<span style="color:#34c759;">✅ Đã đồng bộ lên Google Sheet thành công!</span>';
            } catch (err) {
                syncStatus.innerHTML = '<span style="color:#ff3b30;">⚠️ Chưa đồng bộ lên Drive (Đã lưu an toàn trên máy).</span>';
            }
        }
    }

    function copyReport() {
        const text = document.getElementById('reportOutput').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("Đã sao chép báo cáo! Bạn có thể dán gửi Zalo ngay.");
        });
    }

    function saveToHistory(d, m, y, dateStr, workDay, orders, revenue, cumulative, cumulativeOrders, deduction, rawText) {
        let history = JSON.parse(localStorage.getItem('hd_history') || '[]');
        
        history.unshift({
            day: d,
            month: m,
            year: y,
            date: dateStr,
            workDay: workDay,
            orders: orders,
            revenue: revenue,
            cumulative: cumulative,
            cumulativeOrders: cumulativeOrders,
            deduction: deduction,
            rawText: rawText || ''
        });

        localStorage.setItem('hd_history', JSON.stringify(history));
        renderHistory();

        // Tự động nhảy sang ngày tiếp theo
        const next = calculateNextDay(d, m, y);
        setDateFields(next.day, next.month, next.year);

        if (next.day === 1) {
            applyMung1RuleIfDay1(1);
        } else {
            document.getElementById('prevRevenue').value = cumulative;
            document.getElementById('prevOrders').value = cumulativeOrders;
            document.getElementById('workDay').value = parseInt(workDay, 10) + 1;
        }

        document.getElementById('rawText').value = '';
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('hd_history') || '[]');
        const container = document.getElementById('historyList');
        if (history.length === 0) {
            container.innerHTML = '<p style="color:#8e8e93; font-size:12px; margin:0;">Chưa có dữ liệu nào trong lịch sử.</p>';
            return;
        }
        container.innerHTML = history.map(item => `
            <div class="history-item">
                <span><b>📅 ${item.date}</b> (${item.orders} đơn${item.deduction > 0 ? ` - trừ ${item.deduction}k` : ''})</span>
                <span>Ngày: <b>${item.revenue.toLocaleString('vi-VN')}k</b> | DS lũy kế: <b>${item.cumulative.toLocaleString('vi-VN')}k</b></span>
            </div>
        `).join('');
    }

    function exportToCSV() {
        const history = JSON.parse(localStorage.getItem('hd_history') || '[]');
        if (history.length === 0) {
            alert("Chưa có lịch sử để xuất bảng tính!");
            return;
        }

        let csvContent = "\uFEFF";
        csvContent += "Ngày,Ngày công,Số đơn ngày,DS ngày (k),Tiền trừ rớt (k),DS lũy kế (k),Tổng đơn lũy kế\n";

        const exportData = [...history].reverse();
        exportData.forEach(row => {
            csvContent += `"${row.date}",${row.workDay},${row.orders},${row.revenue},${row.deduction || 0},${row.cumulative},${row.cumulativeOrders}\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `Bao_Cao_Ban_Hang_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function toggleElement(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'none') ? 'block' : 'none';
    }

    function clearHistory() {
        if (confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử các ngày đã tính? (Các cài đặt KPI vẫn được giữ nguyên)")) {
            localStorage.removeItem('hd_history');
            location.reload();
        }
    }
</script>

</body>
